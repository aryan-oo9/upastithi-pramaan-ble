name: upastithi_pramaan
description: Offline-first multi-modal attendance system
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  crypto: ^3.0.3
  # ── Navigation ────────────────────────────────────────
  go_router: ^14.2.0

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local Database (Drift — replaces Isar) ────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.0          # Flutter-specific drift helpers
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Camera & AI ───────────────────────────────────────
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.11.0

  # ── BLE ───────────────────────────────────────────────
  flutter_blue_plus: ^1.32.12

  # ── Permissions ───────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Networking / Sync ─────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── Utilities ─────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0             # replaces isar_generator
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/

  